name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # v5 e o primeiro major destas actions que roda em node24; a v4 (node20) esta deprecada.
      - uses: actions/checkout@v5
        with:
          # O commitlint valida o RANGE de commits do PR; o checkout raso (default) nao
          # enxerga os commits e o step falharia por nao achar o range.
          fetch-depth: 0
      # LTS mais recente; o reporter lcov do node:test (cobertura) exige >= 22, atendido pelo LTS atual.
      - uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          cache: npm
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Convencao de commit (CONSTITUTION §5)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx --no -- commitlint \
              --from "${{ github.event.pull_request.base.sha }}" \
              --to "${{ github.event.pull_request.head.sha }}" --verbose
          else
            npx --no -- commitlint --from HEAD~1 --to HEAD --verbose
          fi

      - name: Auditoria de dependencias
        run: npm audit --audit-level=high

      - run: node bin/mgr.js validate
      - name: Verifica as fontes unicas de leis e de primicias (ADR-0011, ADR-0022)
        run: npm run check:laws

      # O mesmo script que o .githooks/pre-commit roda. Ele esta nos DOIS lugares de proposito:
      # `--no-verify` contorna hook local, e o CI nao.
      - name: Verifica padrao de verificacao defeituosa
        run: npm run check:claims

      # Estrutural: compara CONJUNTOS DE IDS entre o registro do codigo e a coluna de id das tabelas
      # dos documentos. Nunca casa prosa — a nota de desenho de scripts/check-laws.mjs proibe.
      - name: Verifica a coerencia da lista de verificacoes do doctor
        run: npm run check:checks

      # Gate de cobertura: o script `coverage` traz --test-coverage-lines=95 e sai != 0 abaixo disso.
      - run: npm run coverage

      - name: Enviar cobertura ao Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: lcov.info
          # Coveralls e reporting, nao gate: nao derruba o CI se o upload falhar.
          # Quem veta a queda de cobertura e o step acima (--test-coverage-lines).
          fail-on-error: false
